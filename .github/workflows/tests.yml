name: tests

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax
        run: |
          php -l src/bootstrap.php
          php -l bin/build.php
      - name: Tests
        run: php tests/run.php
      - name: Build
        run: php bin/build.php
